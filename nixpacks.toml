# Nixpacks detecta un único lenguaje por proyecto. Aquí conviven Python, que
# ejecuta la API de Django, y Node, que compila el cliente de React, así que
# ambos se declaran a mano.

providers = ["python", "node"]

[phases.setup]
nixPkgs = ["python312", "nodejs_20", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt",
  "npm ci --prefix cliente",
]

[phases.build]
# El orden importa: `npm run build` deja el cliente en static_build/, y
# settings.py sólo añade static_build/assets a STATICFILES_DIRS si ese
# directorio ya existe. Invertir los comandos no da error: collectstatic
# simplemente no recogería nada.
cmds = [
  "npm run build --prefix cliente",
  ". /opt/venv/bin/activate && python manage.py collectstatic --noinput",
]

[start]
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -"
