[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brotherhood-pt2"
version = "2.0.0"
description = "REST API de gestión de citas con autenticación para la barbería TheBrotherhood — Proyecto 04, Desarrollo de Aplicaciones Web"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.139.0",
    "pydantic[email]",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "pyjwt",
    "bcrypt",
]

[tool.fastapi]
entrypoint = "main:app"

# `db` y `tests` contienen scripts, no paquetes instalables: sin esta lista
# setuptools encuentra varios directorios de primer nivel y aborta el build.
[tool.setuptools]
packages = ["app", "app.routers"]
py-modules = ["main"]
