[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brotherhood-api"
version = "3.0.0"
description = "API de gestión de citas de TheBrotherhood (Proyecto 04)"
requires-python = ">=3.12"
dependencies = [
    "django",
    "djangorestframework",
    "django-cors-headers",
    "drf-spectacular",
    "python-dotenv",
    "psycopg[binary]",
    "pyjwt",
    "bcrypt",
]

[tool.setuptools]
# Se listan a mano porque `db/`, `docs/`, `tests/` y `cliente/` no son
# paquetes y confundirían al descubrimiento automático.
packages = ["apps", "apps.usuarios", "apps.catalogo", "apps.citas", "config"]
py-modules = ["manage"]
